[tool.poetry]
name = "wokibi-eval"
version = "0.1.0"
description = "Wokibi evaluation jobs and notebooks (ranking, clinical judge, UMAP)"
authors = ["Wesllen Sousa Lima"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "wokibi_eval", from = "src" }]

include = [
  { path = "src/wokibi_eval/prompts/**/*.yaml", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
wokibi-ai = { version = "^1.5.0", source = "testpypi" }
wokibi-data = { version = "^1.4.0", source = "testpypi" }
umap-learn = "^0.5.9"
matplotlib = "^3.8.0"
fire = "^0.7.1"
tqdm = "^4.66.0"
pyyaml = "^6.0.2"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.poetry.group.clinical]
optional = true

[tool.poetry.group.clinical.dependencies]
spacy = "^3.8.0"
sentence-transformers = "^3.0.0"
scikit-learn = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
jupyter = "^1.1.0"
ipykernel = "^6.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
